name = "maralyrics-api"
main = "worker/worker.js"
compatibility_date = "2024-12-01"

# ─── D1 Database Binding ───
[[d1_databases]]
binding = "DB"
database_name = "maralyrics-db"
database_id = "b27f5e8e-0b46-41df-8738-ddc611da58e3"  # Replace after: wrangler d1 create maralyrics-db

# ─── Static Assets ───
[site]
bucket = "./public"
include = ["**/*"]

# ─── Custom Domain (optional) ───
# routes = [
#   { pattern = "maralyrics.example.com", custom_domain = true }
# ]

# ─── Environment Variables ───
[vars]
ENVIRONMENT = "production"
# Sign in with Google: the OAuth "Web application" client id from Google Cloud Console (a public value, not a secret).
# Leave empty to hide the Google button. Authorised JavaScript origins must include https://maralyrics.com
GOOGLE_CLIENT_ID = "1008973631492-5n19m9dvld2e3a2gvs07fb0v2sg3fbau.apps.googleusercontent.com"
# Email through Resend. The sender's domain must be verified in Resend. Links in emails point at SITE_ORIGIN.
MAIL_FROM = "MaraLyrics <noreply@maralyrics.com>"
SITE_ORIGIN = "https://maralyrics.com"

# ─── Secrets (set via `wrangler secret put <NAME>`, never committed) ───
# JWT_SECRET           — signs/verifies admin session JWTs (see admin_users table + worker/lib/auth.js)
# TURNSTILE_SECRET_KEY — Cloudflare Turnstile secret key, verifies /reports and /contacts submissions
# RESEND_API_KEY       — Resend API key (wrangler secret put RESEND_API_KEY). Unset = email is off: nobody is asked to confirm an
#                        address and "Forgot password" is hidden, so a half-configured deploy never locks anyone out.
# See .dev.vars.example for local development.
