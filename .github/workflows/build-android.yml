name: Build Android admin app

# Builds and signs the MaraLyrics Admin Trusted Web Activity APK
# (android/) on GitHub's runners, since the sandbox that scaffolded this
# project can't reach dl.google.com to download the Android SDK itself.
#
# One-time setup before this can produce a signed APK: add these four
# repo secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   - `base64 -w0 maralyrics-admin-release.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         - "maralyrics-admin"
#   ANDROID_KEY_PASSWORD      - same as ANDROID_KEYSTORE_PASSWORD (PKCS12)
# Without them, this still builds a debug-signed APK (useful to sanity-check
# the project compiles) but it won't verify against
# public/.well-known/assetlinks.json on a real device.
#
# Note: secrets can't be referenced in a step's `if:` condition (GitHub
# Actions rejects the whole workflow at dispatch time with "Unrecognized
# named-value: 'secrets'" if you try) — they're passed via `env:` instead,
# and the choice between a release and a debug build is made in shell.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's own default package list — it still
          # includes the legacy standalone "tools" package, which Google
          # discontinued years ago and no longer serves, so sdkmanager exits
          # 1 with "Failed to find package 'tools'" before anything else
          # runs. Install only what this project's compileSdk (34) actually
          # needs; AGP fetches anything else itself during the Gradle build.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (release if signing secrets are set, debug otherwise)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # build.gradle's signingConfigs.release resolves RELEASE_STORE_FILE
            # with file(...), which is relative to the *app* module's project
            # dir (android/app/), not this step's android/ working-directory —
            # so the keystore has to land in app/, not here.
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ./gradlew assembleRelease \
              -PRELEASE_STORE_FILE=release.keystore \
              -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            rm -f app/release.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building a debug-signed APK instead of a release one. See the comment at the top of this workflow file for the one-time setup."
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: maralyrics-admin-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
